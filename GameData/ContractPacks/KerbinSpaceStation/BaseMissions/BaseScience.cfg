CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_BaseScience_title_s1 = #loc_KSS_BaseScience_title_s1
		loc_KSS_BaseScience_description_s1 = #loc_KSS_BaseScience_description_s1
		loc_KSS_BaseScience_description_s2 = #loc_KSS_BaseScience_description_s2
		loc_KSS_BaseScience_synopsis_s1 = #loc_KSS_BaseScience_synopsis_s1
		loc_KSS_BaseScience_PARAMETER2_title_3_s1 = #loc_KSS_BaseScience_PARAMETER2_title_3_s1
	}

    name = BaseScience
    title = @/loc_KSS_BaseScience_title_s1 + @/ScienceTarget
	genericTitle = #loc_KSS_BaseScience_genericTitle
    group = BasesandStations
	description = @/loc_KSS_BaseScience_description_s1 + @/targetBody1 + @/loc_KSS_BaseScience_description_s2
	genericDescription = #loc_KSS_BaseScience_genericDescription
    synopsis = @/loc_KSS_BaseScience_synopsis_s1 + @/ScienceTarget.
    completedMessage = #loc_KSS_BaseScience_completedMessage
    minExpiry = 1
    maxExpiry = 7
    cancellable = true
    declinable = true
	maxSimultaneous = 1
    rewardScience = 30.0
    rewardReputation = Random(1.0, 2.0)
    rewardFunds = Random(40000, 60000.0)
    failureReputation = Random(1, 10.0)
    failureFunds = Random(1, 10000.0)
    advanceFunds = Random(1, 10000.0)
	targetBody = @/targetBody1
	DATA
    {
        type = Vessel
        requiredValue = true
		uniquenessCheck = CONTRACT_ALL
        ScienceTarget = AllVessels().Where(v => v.VesselType() == Base && v.IsLanded() && v.CrewCount() > 0).SelectUnique()
		title = #loc_KSS_BaseScience_DATA1_title
    }
	DATA
	{
        type = CelestialBody
		requiredValue = true
		targetBody1 = @/ScienceTarget.CelestialBody()
		hidden = true
    }

    DATA
	{
        type = Location
		vesselLocation = @ScienceTarget.Location()	
		hidden = true
    }

	PARAMETER
	{
	    name = ScienceLab
		type = PartValidation
		title = #loc_KSS_BaseScience_PARAMETER1_title_2
	    partModule = ModuleScienceLab
		minCount = 1		
	}
	PARAMETER
	{
	name = All
	type = All
	hideChildren = true
	title = @/loc_KSS_BaseScience_PARAMETER2_title_3_s1 + @/ScienceTarget
	PARAMETER
    {
        name = VisitWaypoint
		type = VisitWaypoint
		index = 0
		distance = 2000.0
	}
	PARAMETER
	{
	name = ReachState
	type = ReachState
	targetBody = @/targetBody1
	situation = LANDED
	situation = SPLASHED
	}
	}
	 BEHAVIOUR
    {
        name = WaypointGenerator
		type = WaypointGenerator
		WAYPOINT
        {    name = #loc_KSS_shared_Base
		     targetBody = @/targetBody1
			 icon = balloon
			 altitude = 0.0
			 latitude = @/vesselLocation.Latitude()
			 longitude = @/vesselLocation.Longitude()
        }
    }
    REQUIREMENT
    {
        name = PartModuleUnlocked
        type = PartModuleUnlocked
        partModule = ModuleScienceLab
    }
	
	PARAMETER
{
    name = NewVessel
    type = NewVessel
	title = #loc_KSS_BaseScience_PARAMETER3_title_4
}

		REQUIREMENT
	{
	name = Scanner
	checkOnActiveContract = false
	type = Expression
	expression = (!@/targetBody1.IsHomeWorld())
	title = #loc_KSS_shared_Base_must_not_be_on_the_homeworld
	}
}