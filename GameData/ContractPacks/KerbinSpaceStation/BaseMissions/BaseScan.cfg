CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_BaseScan_description_s1 = #loc_KSS_BaseScan_description_s1
		loc_KSS_BaseScan_description_s2 = #loc_KSS_BaseScan_description_s2
	}

    name = BaseScan
	group = BasesandStations 
	title = #loc_KSS_BaseScan_title
	description = @/loc_KSS_BaseScan_description_s1 + @/targetBody1. + @/loc_KSS_BaseScan_description_s2
	genericDescription = #loc_KSS_BaseScan_genericDescription
	synopsis = #loc_KSS_BaseScan_synopsis
	completedMessage = #loc_KSS_BaseScan_completedMessage
    minExpiry = 3.0
	maxExpiry = 7.0
	cancellable = true
	declinable = true 
	autoAccept = false
	prestige = Significant
	maxSimultaneous = 1    
	rewardScience = 0.0
	rewardReputation = 1.0
	rewardFunds = Random(20000, 24000.0)
	failureReputation = 10.0
	failureFunds = 10000.0
	advanceFunds = 1000.0
	targetBody = @/targetBody1

	DATA:NEEDS[!SCANsat]
	{
		type = CelestialBody
		requiredValue = true
		uniquenessCheck = CONTRACT_ACTIVE
		targetBody1 = OrbitedBodies().Where(b => b.IsOrbitalSurveyComplete() == false && b.HasSurface()).SelectUnique()
		title = #loc_KSS_BaseScan_DATA1_title
	}

	DATA:NEEDS[SCANsat]
	{
		type = CelestialBody
		requiredValue = true
		uniquenessCheck = CONTRACT_ACTIVE
		targetBody1 = OrbitedBodies().Where(b => b.SCANsatCoverage("AltimetryHiRes") < 80 && b.HasSurface()).SelectUnique()
		title = #loc_KSS_BaseScan_DATA1_title_2
	}
	
	PARAMETER:NEEDS[!SCANsat]
	{
    name = PerformOrbitalSurvey
    type = PerformOrbitalSurvey
	targetBody = @/targetBody1
	}
	
	PARAMETER:NEEDS[SCANsat]
	{
	name = SCANsatCoverage
    type = SCANsatCoverage
	targetBody = @/targetBody1
	coverage = Random(80, 95)
	scanType = AltimetryHiRes
	}
	
	REQUIREMENT
	{
	name = Scanner
	type = Expression
	expression = (!@/targetBody1.IsHomeWorld())
	title = #loc_KSS_BaseScan_REQUIREMENT1_title_3
	}
	REQUIREMENT:NEEDS[!SCANsat]
	{
	name = PartModuleUnlocked
    type = PartModuleUnlocked
	checkOnActiveContract = false
	partModule = ModuleOrbitalSurveyor
	}
	REQUIREMENT:NEEDS[SCANsat]
	{
	name = PartUnlocked
    type = PartUnlocked
	checkOnActiveContract = false
	part = scansat-sar-paz-1
	}
	REQUIREMENT:NEEDS[SCANsat]
	{
    name = SCANsatCoverage
    type = SCANsatCoverage
	maxCoverage = 80.0
	scanType = AltimetryHiRes
	}
}
	
