CONTRACT_TYPE:NEEDS[TACLifeSupport|USILifeSupport|IFILifeSupport|Kerbalism|Snacks]
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_shared_Do_a_supply_run_to = #loc_KSS_shared_Do_a_supply_run_to
		loc_KSS_BaseResupply_description_s1 = #loc_KSS_BaseResupply_description_s1
		loc_KSS_BaseResupply_description_s2 = #loc_KSS_BaseResupply_description_s2
		loc_KSS_BaseResupply_synopsis_s1 = #loc_KSS_BaseResupply_synopsis_s1
		loc_KSS_BaseResupply_synopsis_s2 = #loc_KSS_BaseResupply_synopsis_s2
	}

    name = BaseResupply
    title = @/loc_KSS_shared_Do_a_supply_run_to + @/targetVessel1
	genericTitle = #loc_KSS_BaseResupply_genericTitle
    group = BasesandStations
	description = @/loc_KSS_BaseResupply_description_s1 + @/targetVessel1 + @/loc_KSS_BaseResupply_description_s2
	genericDescription = #loc_KSS_BaseResupply_genericDescription
    notes = #loc_KSS_BaseResupply_notes
    synopsis = @/loc_KSS_BaseResupply_synopsis_s1 + @/targetVessel1 + @/loc_KSS_BaseResupply_synopsis_s2
    completedMessage = #loc_KSS_BaseResupply_completedMessage
    minExpiry = 1
    maxExpiry = 7
    cancellable = true
    declinable = true
	maxSimultaneous = 1
    rewardScience = 0.0
    rewardReputation = Random(1, 2)
    rewardFunds = Random(40000, 60000.0)
    failureReputation = Random(1,2)
    failureFunds = Random(1000, 10000.0)
    advanceFunds = Random(1000, 10000.0)
	targetBody = @/targetBody1
	
	DATA
    {
        type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		targetVessel1 = AllVessels().Where(v => v.VesselType()== Base && v.CrewCount()>= 1).SelectUnique()
		title = #loc_KSS_shared_Must_have_a_crewed_base
    }
	
	DATA:NEEDS[TACLifeSupport|Kerbalism]
	{
		type = double
		requiredValue = true
		FoodLevel = @targetVessel1.ResourceQuantity(Food) + 10
	}
	
	DATA:NEEDS[USILifeSupport]
	{
		type = double
		requiredValue = true
		FoodLevel = @targetVessel1.ResourceQuantity(Supplies) + 10
	}
	
	DATA:NEEDS[IFILifeSupport]
	{
		type = double
		requiredValue = true
		FoodLevel = @targetVessel1.ResourceQuantity(LifeSupport) + 10
	}
	
	DATA:NEEDS[Snacks]
	{
		type = double
		requiredValue = true
		FoodLevel = @targetVessel1.ResourceQuantity(Snacks) + 10
	}
	
	DATA
	{
	    type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}
    
	DATA
	{
        type = Location
		vesselLocation = @/targetVessel1.Location()	
		hidden = true
    }

	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		vessel = @/targetVessel1
		
		PARAMETER:NEEDS[TACLifeSupport|Kerbalism]
		{
			name = Food
			type = HasResource
			resource = Food
			minQuantity = @/FoodLevel
		}	
		PARAMETER:NEEDS[USILifeSupport]
		{
			name = Supplies
			type = HasResource	
			resource = Supplies
			minQuantity = @/FoodLevel
		}
		PARAMETER:NEEDS[IFILifeSupport]
		{
			name = LifeSupport
			type = HasResource
			resource = LifeSupport
			minQuantity = @/FoodLevel
		}
		PARAMETER:NEEDS[Snacks]
		{
			name = Snacks
			type = HasResource
			resource = Snacks
			minQuantity = @/FoodLevel
		}
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = BaseResupply
		minCount = 0
		cooldownDuration = 10d
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = Expression
		checkOnActiveContract = false
		expression = (!@/targetBody1.IsHomeWorld())
		title = #loc_KSS_shared_Base_must_not_be_on_the_homeworld
	}
}
