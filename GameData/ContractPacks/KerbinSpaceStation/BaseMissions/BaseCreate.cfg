CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_BaseCreate_title_s1 = #loc_KSS_BaseCreate_title_s1
		loc_KSS_BaseCreate_description_s1 = #loc_KSS_BaseCreate_description_s1
		loc_KSS_BaseCreate_description_s2 = #loc_KSS_BaseCreate_description_s2
		loc_KSS_BaseCreate_notes_s1 = #loc_KSS_BaseCreate_notes_s1
		loc_KSS_BaseCreate_notes_s2 = #loc_KSS_BaseCreate_notes_s2
		loc_KSS_BaseCreate_synopsis_s1 = #loc_KSS_BaseCreate_synopsis_s1
		loc_KSS_BaseCreate_synopsis_s2 = #loc_KSS_BaseCreate_synopsis_s2
		loc_KSS_BaseCreate_completedMessage_s1 = #loc_KSS_BaseCreate_completedMessage_s1
		loc_KSS_BaseCreate_completedMessage_s2 = #loc_KSS_BaseCreate_completedMessage_s2
		loc_KSS_BaseCreate_PARAMETER1_PARAMETER3_title_3_s1 = #loc_KSS_BaseCreate_PARAMETER1_PARAMETER3_title_3_s1
		loc_KSS_BaseCreate_PARAMETER1_PARAMETER3_title_3_s2 = #loc_KSS_BaseCreate_PARAMETER1_PARAMETER3_title_3_s2
	}

	name = BaseCreate	  
    title = @/loc_KSS_BaseCreate_title_s1 + @/targetBody1
    group = BasesandStations
	description = @/loc_KSS_BaseCreate_description_s1 + @/targetBody1 + @/loc_KSS_BaseCreate_description_s2
    notes = @/loc_KSS_BaseCreate_notes_s1 + @targetBody1 + @/loc_KSS_BaseCreate_notes_s2
	genericTitle = #loc_KSS_BaseCreate_genericTitle
	genericDescription = #loc_KSS_BaseCreate_genericDescription
    synopsis = @/loc_KSS_BaseCreate_synopsis_s1 + @/targetBody1 + @/loc_KSS_BaseCreate_synopsis_s2
    completedMessage = @/loc_KSS_BaseCreate_completedMessage_s1 + @/targetBody1 + @/loc_KSS_BaseCreate_completedMessage_s2
    minExpiry = 1.0
    maxExpiry = 7.0
    cancellable = true
    declinable = true 
    autoAccept = false
    targetBody = @/targetBody1
	maxSimultaneous = 1 
    rewardScience = 0.0
    rewardReputation = 5.0
    rewardFunds = Random(40000, 60000)
    failureReputation = 10.00
    failureFunds = 100000.0
    advanceFunds = 1000.0
    DATA	
    {
	    type = Vessel
		uniquenessCheck = CONTRACT_ACTIVE
		requiredValue = true
        targetVessel1 = [ BaseRover ].Where(v => v.IsLanded()).Random()
		title = #loc_KSS_BaseCreate_DATA1_title
	}
	DATA
	{
        type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
    }
	DATA
	{
        type = Location
		vesselLocation = @/targetVessel1.Location()
		hidden = true
    }
    BEHAVIOUR
    {
        name = WaypointGenerator
		type = WaypointGenerator
		WAYPOINT
        {    name = #loc_KSS_BaseCreate_BEHAVIOUR1_WAYPOINT1_name
		     targetBody = @/targetBody1
			 icon = balloon
			 altitude = 0.0
			 latitude = @/vesselLocation.Latitude()
			 longitude = @/vesselLocation.Longitude()
        }
    }
	
	BEHAVIOUR
{
    name = Expression
    type = Expression
	    CONTRACT_COMPLETED_FAILURE
    {
        type = bool
		BaseConstruction = false
	}
		    CONTRACT_COMPLETED_SUCCESS
    {
        type = bool
		BaseConstruction = false
	}
}
PARAMETER
{
name = All
type = All
	    PARAMETER
        {
            name = HabModule
            type = HasCrewCapacity        
            minCapacity = 4
            title = #loc_KSS_shared_Support_4_Kerbals
			hideChildren = true
        }
		
		PARAMETER
        {
            name = Any
			type = Any
			hideChildren = false
			title = #loc_KSS_shared_Have_one_of_the_following_power_generators
			PARAMETER
			{
                name = Solar
				title = #loc_KSS_shared_1_or_more_solar_panels
				type = PartValidation
				hideChildren = true
				partModule = ModuleDeployableSolarPanel
				minCount = 1 	     
			}
			PARAMETER:NEEDS[Kopernicus]
			{
                name = Solar
				title = #loc_KSS_shared_1_or_more_solar_panels
				type = PartValidation
				hideChildren = true
				partModule = KopernicusSolarPanel
				minCount = 1 	     
			}
			PARAMETER
			{
                name = Generator
				title = #loc_KSS_BaseCreate_PARAMETER1_PARAMETER2_PARAMETER2_title_3
				type = PartValidation
				hideChildren = true
				partModule = ModuleGenerator
				minCount = 1 
			}
			PARAMETER
			{
                name = Generator1
				title = #loc_KSS_BaseCreate_PARAMETER1_PARAMETER2_PARAMETER3_title_4
				type = PartValidation
				hideChildren = true
				part = FuelCell
				minCount = 1 	
			}
			PARAMETER
			{
                name = Generator2
				title = #loc_KSS_BaseCreate_PARAMETER1_PARAMETER2_PARAMETER4_title_5
				type = PartValidation
				hideChildren = true
				part = FuelCellArray
				minCount = 1
			}
			PARAMETER:NEEDS[NearFutureSolar]
			{
			name = PartValidationNearFutureSolar
			type = PartValidation
			title = #loc_KSS_shared_1_or_more_curved_solar_panels
			hideChildren = true
			partModule = ModuleCurvedSolarPanel
			minCount = 1
			}
			PARAMETER:NEEDS[NearFutureElectrical]
			{
			name = PartValidationNearFutureReactors
			type = PartValidation
			title = #loc_KSS_shared_1_or_more_fission_reactors
			hideChildren = true
			partModule = FissionReactor
			minCount = 1
			}
			PARAMETER:NEEDS[NearFutureElectrical]
			{
			name = PartValidationNearFutureRTGs
			type = PartValidation
			title = #loc_KSS_shared_1_or_more_radioisotope_generators
			hideChildren = true
			partModule = ModuleRadioisotopeGenerator
			minCount = 1
			}
		}		
    PARAMETER
    {
        name = VisitWaypoint
		type = VisitWaypoint
		index = 0
		distance = 2000.0
		title = @/loc_KSS_BaseCreate_PARAMETER1_PARAMETER3_title_3_s1 + @/targetBody1 + @/loc_KSS_BaseCreate_PARAMETER1_PARAMETER3_title_3_s2
		showMessages = true
	}
	PARAMETER
{
    name = ReachState
    type = ReachState
	hidden = true
	hideChildren = true
	situation = LANDED
	situation = SPLASHED
}
PARAMETER
{
    name = VesselIsType
    type = VesselIsType
	vesselType = Base
}
}
	
	REQUIREMENT
	{
		name = BaseConstruct
		type = Expression
		checkOnActiveContract = false
		expression = ($BaseConstruction == true)
		title = #loc_KSS_shared_Must_not_be_constructing_another_base
	}
	
	REQUIREMENT
	{
		name = Scanner
		type = Expression
		checkOnActiveContract = false
		expression = (!@/targetBody1.IsHomeWorld())
		title = #loc_KSS_shared_Base_must_not_be_on_the_homeworld
	}
}
