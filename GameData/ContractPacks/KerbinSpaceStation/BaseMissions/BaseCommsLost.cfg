CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_BaseCommsLost_title_s1 = #loc_KSS_BaseCommsLost_title_s1
		loc_KSS_BaseCommsLost_description_s1 = #loc_KSS_BaseCommsLost_description_s1
		loc_KSS_BaseCommsLost_description_s2 = #loc_KSS_BaseCommsLost_description_s2
		loc_KSS_BaseCommsLost_synopsis_s1 = #loc_KSS_BaseCommsLost_synopsis_s1
		loc_KSS_BaseCommsLost_synopsis_s2 = #loc_KSS_BaseCommsLost_synopsis_s2
		loc_KSS_BaseCommsLost_completedMessage_s1 = #loc_KSS_BaseCommsLost_completedMessage_s1
		loc_KSS_BaseCommsLost_completedMessage_s2 = #loc_KSS_BaseCommsLost_completedMessage_s2
		loc_KSS_BaseCommsLost_PARAMETER1_PARAMETER3_title_s1 = #loc_KSS_BaseCommsLost_PARAMETER1_PARAMETER3_title_s1
		loc_KSS_BaseCommsLost_PARAMETER1_PARAMETER3_title_s2 = #loc_KSS_BaseCommsLost_PARAMETER1_PARAMETER3_title_s2
	}

    name = BaseCommsLost
    title = @/loc_KSS_BaseCommsLost_title_s1 + @/targetVessel1
	genericTitle = #loc_KSS_BaseCommsLost_genericTitle
    group = BasesandStations
	description = @/loc_KSS_BaseCommsLost_description_s1 + @/targetVessel1 + @/loc_KSS_BaseCommsLost_description_s2
	genericDescription = #loc_KSS_BaseCommsLost_genericDescription
    synopsis = @/loc_KSS_BaseCommsLost_synopsis_s1 + @/targetVessel1 + @/loc_KSS_BaseCommsLost_synopsis_s2
    completedMessage = @/loc_KSS_BaseCommsLost_completedMessage_s1 + @/targetVessel1 + @/loc_KSS_BaseCommsLost_completedMessage_s2
    minExpiry = 1
    maxExpiry = 7
	maxSimultaneous = 1
    cancellable = false
    declinable = true
    rewardScience = 0.0
    rewardReputation = Random(1, 2)
    rewardFunds = Random(40000, 60000.0)
    failureReputation = Random(1, 2)
    failureFunds = Random(1000, 10000.0)
    advanceFunds = Random(1000, 10000.0)
	targetBody = @/targetBody1
    
	DATA
    {
        type = Vessel
		requiredValue = true
		uniquenessCheck = GROUP_ACTIVE
		targetVessel1 = AllVessels().Where(v => v.VesselType()== Base && v.IsLanded() && v.CrewCount() >0).SelectUnique()
		title = #loc_KSS_shared_Must_have_a_crewed_base
    }
	
	DATA
	{
        type = Location
		vesselLocation = @/targetVessel1.Location()
		hidden = true
    }

	DATA
	{
        type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
    } 

	BEHAVIOUR
    {
        name = WaypointGenerator
		type = WaypointGenerator
		WAYPOINT
        {    name = #loc_KSS_BaseCommsLost_BEHAVIOUR1_WAYPOINT1_name
		     targetBody = @/targetBody1
			 icon = balloon
			 altitude = 0.0
			 latitude = @/vesselLocation.Latitude()
			 longitude = @/vesselLocation.Longitude()
        }
    }
	
	BEHAVIOUR
	{
		name = ChangeVesselOwnership
		type = ChangeVesselOwnership
		onState = CONTRACT_ACCEPTED
		vessel = @/targetVessel1
		owned = false
	}

	BEHAVIOUR
	{
		name = ChangeVesselOwnership
		type = ChangeVesselOwnership
		onState = CONTRACT_SUCCESS
		vessel = @/targetVessel1
		owned = true
	}

	PARAMETER
	{
		name = Engineer
		type = All

		PARAMETER
		{
			name = VesselIsType
			type = VesselIsType
			vesselType = EVA
		}
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			trait = Engineer 
		}
				
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0	
			distance = 100.0
			title = @/loc_KSS_BaseCommsLost_PARAMETER1_PARAMETER3_title_s1 + @/targetBody1 + @/loc_KSS_BaseCommsLost_PARAMETER1_PARAMETER3_title_s2
		}
	}

	PARAMETER
	{
		name = Duration
		type = Duration
		duration = 2m
		preWaitText = #loc_KSS_shared_Waiting_for_an_Engineer
		waitingText = #loc_KSS_shared_Repair_in_progress
		completionText = #loc_KSS_BaseCommsLost_PARAMETER2_completionText
		completeInSequence = true
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = BaseCommsLost
		minCount = 0
		cooldownDuration = 30d
	}

	// REQUIREMENT
	// {
		// name = CompleteContract
		// type = Expression
		// checkOnActiveContract = false
		// expression = (!@/targetBody1.IsHomeWorld())
		// title = Must not be on the homeworld
	// }

	REQUIREMENT
	{
		name = RandomRoll
		type = Expression
		checkOnActiveContract = false
		expression = @BasesandStations:randomRoll <3
		title = #loc_KSS_shared_The_RNG_must_like_you
	}
}