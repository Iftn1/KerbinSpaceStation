CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_BaseRover_title_s1 = #loc_KSS_BaseRover_title_s1
		loc_KSS_BaseRover_title_s2 = #loc_KSS_BaseRover_title_s2
		loc_KSS_BaseRover_description_s1 = #loc_KSS_BaseRover_description_s1
		loc_KSS_BaseRover_description_s2 = #loc_KSS_BaseRover_description_s2
		loc_KSS_BaseRover_synopsis_s1 = #loc_KSS_BaseRover_synopsis_s1
		loc_KSS_BaseRover_synopsis_s2 = #loc_KSS_BaseRover_synopsis_s2
		loc_KSS_BaseRover_PARAMETER1_PARAMETER1_title_s1 = #loc_KSS_BaseRover_PARAMETER1_PARAMETER1_title_s1
	}

	name = BaseRover	  
    title = @/loc_KSS_BaseRover_title_s1 + @/targetBody1 + @/loc_KSS_BaseRover_title_s2
	genericTitle = #loc_KSS_BaseRover_genericTitle
	description = @/loc_KSS_BaseRover_description_s1 + @/targetBody1 + @/loc_KSS_BaseRover_description_s2
	genericDescription = #loc_KSS_BaseRover_genericDescription
	group = BasesandStations
    synopsis = @/loc_KSS_BaseRover_synopsis_s1 + @/targetBody1 + @/loc_KSS_BaseRover_synopsis_s2
    completedMessage = #loc_KSS_BaseRover_completedMessage
    minExpiry = 3.0
    maxExpiry = 7.0
    cancellable = true
    declinable = true 
    autoAccept = false
    prestige = Significant   
	maxSimultaneous = 1  
    rewardScience = 0.0
    rewardReputation = 2.0
    rewardFunds = Random(20000, 24000)
    failureReputation = 20.0
    failureFunds = 10000.0
    advanceFunds = 1000.0
	targetBody = @/targetBody1
	
DATA:NEEDS[!SCANsat]
	{
		type = CelestialBody
		requiredValue = true
		uniquenessCheck = CONTRACT_ACTIVE
		targetBody1 = LandedBodies().Where(b => b.IsOrbitalSurveyComplete() == true && b.HasSurface()).Random()
		title = #loc_KSS_shared_Scanning_must_be_complete_on_a_body_with_a_surfa
	}

	DATA:NEEDS[SCANsat]
	{
 		type = CelestialBody
		requiredValue = true
		uniquenessCheck = GROUP_ACTIVE
		targetBody1 = LandedBodies().Where(b => b.SCANsatCoverage("AltimetryHiRes") >= 80 && b.HasSurface()).Random()
		title = #loc_KSS_shared_Scanning_must_be_complete_on_a_body_with_a_surfa
	}
	
		DATA
	{
        type = List<Vessel>
		requiredValue = false
		BaseList = AllVessels().Where(v => v.VesselType() == Base && v.CelestialBody() == @/targetBody1)
    }
	
	DATA
	{
		type = List<Vessel>
		requiredValue = false
		RoverCheck = [BaseRover].Where(r => r.CelestialBody() == @/targetBody1)
	}
	BEHAVIOUR
{
    name = Expression
    type = Expression
	    CONTRACT_COMPLETED_SUCCESS
    {
        type = bool
		BaseConstruction = true
    }
}
	
    PARAMETER
    {
    name = NewRover
    type = VesselParameterGroup
    title = #loc_KSS_BaseRover_PARAMETER1_title_3
	define = BaseRover
    notes = #loc_KSS_BaseRover_PARAMETER1_notes
	targetBody = @/targetBody1
		
	PARAMETER
	{
    name = ReachState
    type = ReachState
	hideChildren = true
	title = @/loc_KSS_BaseRover_PARAMETER1_PARAMETER1_title_s1 + @/targetBody1
	targetBody = @/targetBody1
	situation = LANDED
	situation = SPLASHED
	}
	
	PARAMETER
	{
    name = VesselIsType
    type = VesselIsType
	vesselType = Rover
	}
	}
	
	PARAMETER
	{
	name = Duration
    type = Duration
	completeInSequence = true
	duration = 2m
	preWaitText = #loc_KSS_BaseRover_PARAMETER2_preWaitText
	waitingText = #loc_KSS_BaseRover_PARAMETER2_waitingText
	completionText = #loc_KSS_BaseRover_PARAMETER2_completionText
	}
	
	REQUIREMENT
	{
	name = NotHomeworld
	type = Expression
	expression = (!@/targetBody1.IsHomeWorld())
	title = #loc_KSS_shared_Base_must_not_be_on_the_homeworld
	}
		REQUIREMENT
	{
	name = BaseCount
	type = Expression
	checkOnActiveContract = false
	expression = (@/BaseList.Count() == 0)
	title = #loc_KSS_BaseRover_REQUIREMENT2_title_5
	}
	
	REQUIREMENT
	{
	name = RoverCount
	type = Expression
	checkOnActiveContract = false
	expression = (@/RoverCheck.Count() == 0)
	title = #loc_KSS_BaseRover_REQUIREMENT3_title_6
	}
	
		REQUIREMENT
	{
	name = BaseConstruct
	type = Expression
	checkOnActiveContract = false
	expression = ($BaseConstruction != true)
	title = #loc_KSS_shared_Must_not_be_constructing_another_base
	}
	
}
