CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_BaseCrewRotation_title_s1 = #loc_KSS_BaseCrewRotation_title_s1
		loc_KSS_BaseCrewRotation_description_s1 = #loc_KSS_BaseCrewRotation_description_s1
		loc_KSS_BaseCrewRotation_description_s2 = #loc_KSS_BaseCrewRotation_description_s2
		loc_KSS_BaseCrewRotation_description_s3 = #loc_KSS_BaseCrewRotation_description_s3
		loc_KSS_BaseCrewRotation_description_s4 = #loc_KSS_BaseCrewRotation_description_s4
		loc_KSS_BaseCrewRotation_synopsis_s1 = #loc_KSS_BaseCrewRotation_synopsis_s1
		loc_KSS_BaseCrewRotation_synopsis_s2 = #loc_KSS_BaseCrewRotation_synopsis_s2
		loc_KSS_BaseCrewRotation_synopsis_s3 = #loc_KSS_BaseCrewRotation_synopsis_s3
		loc_KSS_BaseCrewRotation_completedMessage_s1 = #loc_KSS_BaseCrewRotation_completedMessage_s1
		loc_KSS_BaseCrewRotation_completedMessage_s2 = #loc_KSS_BaseCrewRotation_completedMessage_s2
		loc_KSS_BaseCrewRotation_PARAMETER1_title_2_s1 = #loc_KSS_BaseCrewRotation_PARAMETER1_title_2_s1
		loc_KSS_BaseCrewRotation_PARAMETER1_title_2_s2 = #loc_KSS_BaseCrewRotation_PARAMETER1_title_2_s2
		loc_KSS_BaseCrewRotation_PARAMETER1_PARAMETER1_title_s1 = #loc_KSS_BaseCrewRotation_PARAMETER1_PARAMETER1_title_s1
		loc_KSS_BaseCrewRotation_PARAMETER1_PARAMETER2_title_2_s1 = #loc_KSS_BaseCrewRotation_PARAMETER1_PARAMETER2_title_2_s1
		loc_KSS_BaseCrewRotation_PARAMETER2_title_3_s1 = #loc_KSS_BaseCrewRotation_PARAMETER2_title_3_s1
		loc_KSS_BaseCrewRotation_PARAMETER2_PARAMETER1_title_s1 = #loc_KSS_BaseCrewRotation_PARAMETER2_PARAMETER1_title_s1
		loc_KSS_BaseCrewRotation_PARAMETER2_PARAMETER1_title_s2 = #loc_KSS_BaseCrewRotation_PARAMETER2_PARAMETER1_title_s2
		loc_KSS_BaseCrewRotation_PARAMETER3_title_4_s1 = #loc_KSS_BaseCrewRotation_PARAMETER3_title_4_s1
		loc_KSS_BaseCrewRotation_PARAMETER4_title_5_s1 = #loc_KSS_BaseCrewRotation_PARAMETER4_title_5_s1
	}

    name = BaseCrewRotation
    title = @/loc_KSS_BaseCrewRotation_title_s1 + @/targetVessel1
	genericTitle = #loc_KSS_BaseCrewRotation_genericTitle
    group = BasesandStations
	description = @/loc_KSS_BaseCrewRotation_description_s1 + @/targetKerbal1 + @/loc_KSS_BaseCrewRotation_description_s2 + @/targetBody2 + @/loc_KSS_BaseCrewRotation_description_s3 + @/targetKerbal2 + @/loc_KSS_BaseCrewRotation_description_s4
	genericDescription = #loc_KSS_BaseCrewRotation_genericDescription
    synopsis = @/loc_KSS_BaseCrewRotation_synopsis_s1 + @/targetKerbal1 + @/loc_KSS_BaseCrewRotation_synopsis_s2 + @/targetKerbal2 + @/loc_KSS_BaseCrewRotation_synopsis_s3 + @/targetBody2.
    completedMessage = @/loc_KSS_BaseCrewRotation_completedMessage_s1 + @/targetKerbal1 + @/loc_KSS_BaseCrewRotation_completedMessage_s2
    minExpiry = 1
    maxExpiry = 7
    cancellable = true
    declinable = true
	maxSimultaneous = 1
    rewardScience = 0.0
    rewardReputation = Random(10.0, 20.0)
    rewardFunds = Random(40000, 60000.0)
    failureReputation = Random(1,2)
    failureFunds = Random(1000, 10000.0)
    advanceFunds = Random(1000, 10000.0)
	targetBody = @/targetBody1
	DATA
    {
        type = Vessel
		requiredValue = true
		uniquenessCheck = GROUP_ACTIVE
		targetVessel1 = AllVessels().Where(v => v.IsLanded() && v.VesselType() == Base && v.CrewCount()>=2).Random()
		title = #loc_KSS_BaseCrewRotation_DATA1_title
    }	
	
	DATA
	{
        type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
    }
	
	DATA
    {
        type = CelestialBody
        requiredValue = false
        targetBody2 = HomeWorld()
		hidden = true
    }
	
	DATA
	{
		type = Kerbal
		uniquenessCheck = GROUP_ACTIVE
		targetKerbal1 = @/targetVessel1.Crew().Random()
		targetKerbal2 = @/targetVessel1.Crew().Exclude(@targetKerbal1).Random()
		hidden = true
		//title = Selecting Crew members to be returned home
	}
    
	DATA
	{
        type = Location
		vesselLocation = @/targetVessel1.Location()	
		hidden = true
    }

	PARAMETER
	{
		name = All
		type = All
		title = @/loc_KSS_BaseCrewRotation_PARAMETER1_title_2_s1 + @/targetBody1 + @/loc_KSS_BaseCrewRotation_PARAMETER1_title_2_s2 + @/targetVessel1
		PARAMETER
		{
			name = ReachState
			type = ReachState
			situation = LANDED
			targetBody = @/targetBody1
			title = @/loc_KSS_BaseCrewRotation_PARAMETER1_PARAMETER1_title_s1 + @/targetBody1
			hideChildren = true	
		}
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 100.0
			title = @/loc_KSS_BaseCrewRotation_PARAMETER1_PARAMETER2_title_2_s1 + @/targetVessel1
		}
	}
		
	PARAMETER
	{
		name = BoardBase
		type = VesselParameterGroup
		title = @/loc_KSS_BaseCrewRotation_PARAMETER2_title_3_s1 + @/targetVessel1
		vessel = @/targetVessel1
		PARAMETER
		{
			name = BoardBase1
			type = HasCrew
			minCrew = 2
			title = @/loc_KSS_BaseCrewRotation_PARAMETER2_PARAMETER1_title_s1 + @/targetVessel1 + @/loc_KSS_BaseCrewRotation_PARAMETER2_PARAMETER1_title_s2
		}
	}
	
	PARAMETER
	{
		name = RecoverKerbal
		type = RecoverKerbal
		kerbal = @/targetKerbal1
		title = @/loc_KSS_BaseCrewRotation_PARAMETER3_title_4_s1 + @/targetKerbal1
	}	
	    
	PARAMETER
	{
		name = RecoverKerbal
		type = RecoverKerbal
		kerbal = @/targetKerbal2
		title = @/loc_KSS_BaseCrewRotation_PARAMETER4_title_5_s1 + @/targetKerbal2
	}
	
	BEHAVIOUR
    {
        name = WaypointGenerator
		type = WaypointGenerator
		
		WAYPOINT
        {    name = #loc_KSS_shared_Base
		     targetBody = @/targetVessel1.CelestialBody()
			 icon = balloon
			 altitude = 0.0
			 latitude = @/vesselLocation.Latitude()
			 longitude = @/vesselLocation.Longitude()
        }
    }
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		checkOnActiveContract = false
		contractType = BaseCrewRotation
		minCount = 0
		cooldownDuration = 10d
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = Expression
		checkOnActiveContract = false
		expression = (!@/targetBody1.IsHomeWorld())
		title = #loc_KSS_shared_Base_must_not_be_on_the_homeworld
	}

REQUIREMENT
	{
		name = RandomRoll
		type = Expression
		checkOnActiveContract = false
		expression = @BasesandStations:randomRoll >5
		title = #loc_KSS_shared_The_RNG_must_like_you
	}
}