CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_BaseExpansion_title_s1 = #loc_KSS_BaseExpansion_title_s1
		loc_KSS_shared_The_Kerbals_on = #loc_KSS_shared_The_Kerbals_on
		loc_KSS_BaseExpansion_description_s2 = #loc_KSS_BaseExpansion_description_s2
		loc_KSS_BaseExpansion_notes_s1 = #loc_KSS_BaseExpansion_notes_s1
		loc_KSS_BaseExpansion_notes_s2 = #loc_KSS_BaseExpansion_notes_s2
		loc_KSS_BaseExpansion_synopsis_s1 = #loc_KSS_BaseExpansion_synopsis_s1
		loc_KSS_BaseExpansion_synopsis_s2 = #loc_KSS_BaseExpansion_synopsis_s2
		loc_KSS_BaseExpansion_completedMessage_s2 = #loc_KSS_BaseExpansion_completedMessage_s2
		loc_KSS_BaseExpansion_PARAMETER2_title_3_s1 = #loc_KSS_BaseExpansion_PARAMETER2_title_3_s1
	}

	name = BaseExpansion
    title = @/loc_KSS_BaseExpansion_title_s1 + @/targetVessel1
	genericTitle = #loc_KSS_BaseExpansion_genericTitle
    group = BasesandStations
	description =  @/loc_KSS_shared_The_Kerbals_on + @/targetVessel1 + @/loc_KSS_BaseExpansion_description_s2
	genericDescription = #loc_KSS_BaseExpansion_genericDescription
    notes = @/loc_KSS_BaseExpansion_notes_s1 + @/targetVessel1 + @/loc_KSS_BaseExpansion_notes_s2
    synopsis = @/loc_KSS_BaseExpansion_synopsis_s1 + @/targetVessel1 + @/loc_KSS_BaseExpansion_synopsis_s2
    completedMessage = @/loc_KSS_shared_The_Kerbals_on + @/targetVessel1 + @/loc_KSS_BaseExpansion_completedMessage_s2
    minExpiry = 0.0
    maxExpiry = 7.0
    cancellable = true
    declinable = true 
    autoAccept = false
    prestige = Significant   
    targetBody = @/targetBody1
	maxSimultaneous = 1   
    rewardScience = 0.0
    rewardReputation = 10.0
    rewardFunds = Random(40000, 60000)
    failureReputation = 10.00
    failureFunds = 100000.0
    advanceFunds = 1000.0  
	DATA
    {
        type = Vessel
        requiredValue = true
		uniquenessCheck = CONTRACT_ACTIVE
        targetVessel1 = AllVessels().Where(v => v.IsLanded() && v.VesselType() == Base && v.EmptyCrewSpace() <4).SelectUnique()
		title = #loc_KSS_BaseExpansion_DATA1_title
    }	
	DATA
	{
        type = Location
		vesselLocation = @/targetVessel1.Location()
		hidden = true
    }
    DATA
	{
        type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
		type = WaypointGenerator
		WAYPOINT
        {    name = #loc_KSS_shared_Base
		     targetBody = @/targetBody1
			 icon = balloon
			 altitude = 0.0
			 latitude = @/vesselLocation.Latitude()
			 longitude = @/vesselLocation.Longitude()
        }
    }

	PARAMETER
    {
        name = HabModule
        type = HasCrewCapacity        
        minCapacity = 4
        title = #loc_KSS_shared_Support_4_Kerbals
    }	

    PARAMETER
    {
        name = VisitWaypoint
		type = VisitWaypoint
		index = 0
		distance = 2000.0
		title = @/loc_KSS_BaseExpansion_PARAMETER2_title_3_s1 + @/targetVessel1
	}
		REQUIREMENT
	{
		name = Scanner
		type = Expression
		checkOnActiveContract = false
		expression = (!@/targetBody1.IsHomeWorld())
		title = #loc_KSS_shared_Base_must_not_be_on_the_homeworld
	}
}