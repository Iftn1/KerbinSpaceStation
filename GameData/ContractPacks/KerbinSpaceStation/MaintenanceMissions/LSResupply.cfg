CONTRACT_TYPE:NEEDS[TACLifeSupport|USILifeSupport|IFILifeSupport|Kerbalism|Snacks]
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_shared_Do_a_supply_run_to = #loc_KSS_shared_Do_a_supply_run_to
		loc_KSS_LSResupply_description_s1 = #loc_KSS_LSResupply_description_s1
		loc_KSS_LSResupply_synopsis_s1 = #loc_KSS_LSResupply_synopsis_s1
		loc_KSS_LSResupply_PARAMETER1_PARAMETER2_title_5_s1 = #loc_KSS_LSResupply_PARAMETER1_PARAMETER2_title_5_s1
	}

	// Unique name of the contract type (required)
	name = LSResupply
	title = @/loc_KSS_shared_Do_a_supply_run_to + @/targetVessel1.
	genericTitle = #loc_KSS_LSResupply_genericTitle
	group = BasesandStations
	description = @/loc_KSS_LSResupply_description_s1 + @/targetVessel1.
	genericDescription = #loc_KSS_LSResupply_genericDescription
	notes = #loc_KSS_LSResupply_notes
	synopsis = @/loc_KSS_LSResupply_synopsis_s1 + @/targetVessel1.
	completedMessage = #loc_KSS_LSResupply_completedMessage
	minExpiry = 1
	maxExpiry = 7
	cancellable = true
	declinable = true
	rewardScience = 0.0
	rewardReputation = Random(1.0, 20.0)
	rewardFunds = Random(40000, 60000.0)
	failureReputation = Random(1, 10.0)
	failureFunds = Random(1, 10000.0)
	advanceFunds = Random(1, 10000.0)
	targetBody = @/targetBody1
	
	DATA
	{
		type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
		targetVessel1 = AllVessels().Where(v => v.VesselType() == Station && v.CrewCount()>0).Random()
		title = #loc_KSS_LSResupply_DATA1_title
	}
	
	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}
	PARAMETER
	{
		name = All
		type = All
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
	
		PARAMETER:NEEDS[TACLifeSupport|Kerbalism]
		{
			name = Food
			type = HasResource
			
			resource = Food
			minQuantity = 1
			
			title = #loc_KSS_LSResupply_PARAMETER1_PARAMETER1_title
		}
	
		PARAMETER:NEEDS[USILifeSupport]
		{
			name = Supplies
			type = HasResource
			
			resource = Supplies
			minQuantity = 1
			
			title = #loc_KSS_shared_Have_Supplies_on_board_your_vessel
		}
		
		PARAMETER:NEEDS[IFILifeSupport]
		{
			name = LifeSupport
			type = HasResource
			resource = LifeSupport
			minQuantity = 1
			title = #loc_KSS_LSResupply_PARAMETER1_PARAMETER1_title_3
		}
		
		PARAMETER:NEEDS[Snacks]
		{
			name = Snacks
			type = HasResource
			resource = Snacks
			minQuantity = 1
			title = #loc_KSS_LSResupply_PARAMETER1_PARAMETER1_title_4
		}
	
		PARAMETER
		{
			name = DockwithStation
			type = Docking
			vessel = @/targetVessel1
			title = @/loc_KSS_LSResupply_PARAMETER1_PARAMETER2_title_5_s1 + @/targetVessel1
			completeInSequence = true
		}
	}
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = LSResupply
		checkOnActiveContract = false
		minCount = 0
		cooldownDuration = 10d
	}

	REQUIREMENT
	{
		name = RandomRoll
		type = Expression
		checkOnActiveContract = false
		expression = @BasesandStations:randomRoll >5
		title = #loc_KSS_shared_The_RNG_must_like_you
	}
}
