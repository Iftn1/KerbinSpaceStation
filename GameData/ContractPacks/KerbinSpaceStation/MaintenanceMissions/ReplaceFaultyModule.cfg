CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_ReplaceFaultyModule_title_s1 = #loc_KSS_ReplaceFaultyModule_title_s1
		loc_KSS_shared_Telemetry_indicates_that_the_power_module_on = #loc_KSS_shared_Telemetry_indicates_that_the_power_module_on
		loc_KSS_ReplaceFaultyModule_description_s2 = #loc_KSS_ReplaceFaultyModule_description_s2
		loc_KSS_ReplaceFaultyModule_synopsis_s1 = #loc_KSS_ReplaceFaultyModule_synopsis_s1
		loc_KSS_ReplaceFaultyModule_PARAMETER1_title_2_s1 = #loc_KSS_ReplaceFaultyModule_PARAMETER1_title_2_s1
		loc_KSS_ReplaceFaultyModule_PARAMETER1_PARAMETER2_title_2_s1 = #loc_KSS_ReplaceFaultyModule_PARAMETER1_PARAMETER2_title_2_s1
	}

    name = ReplaceFaultyModule
    title = @/loc_KSS_ReplaceFaultyModule_title_s1 + @/targetVessel1
	genericTitle = #loc_KSS_ReplaceFaultyModule_genericTitle
    description = @/loc_KSS_shared_Telemetry_indicates_that_the_power_module_on + @/targetVessel1 + @/loc_KSS_ReplaceFaultyModule_description_s2
	genericDescription = #loc_KSS_ReplaceFaultyModule_genericDescription
    synopsis = @/loc_KSS_ReplaceFaultyModule_synopsis_s1 + @/targetVessel1
    completedMessage = #loc_KSS_ReplaceFaultyModule_completedMessage
    minExpiry = 1
    maxExpiry = 7
	group = BasesandStations
    cancellable = true
    declinable = true
    rewardScience = 0
    rewardReputation = Random(1.0, 20.0)
    rewardFunds = Random(40000.0, 60000.0)
    failureReputation = Random(1.0, 10.0)
    failureFunds = Random(1.0, 10000.0)
    advanceFunds = Random(1.0, 10000.0)
	targetBody = @/targetBody1
	
	DATA
    {
        type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
        targetVessel1 = AllVessels().Where(v => v.VesselType() == Station && v.CrewCount()>0).SelectUnique()
		title = #loc_KSS_shared_Must_have_a_space_station_with_crew_in_orbit
    }
	
	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}

	PARAMETER
	{
		name = PowerModule
		type = VesselParameterGroup
		title = @/loc_KSS_ReplaceFaultyModule_PARAMETER1_title_2_s1 + @/targetVessel1.
		//make sure the module has some form of power generation.
		
		PARAMETER
		{
			name = RTGSolar
			type = Any
			title = #loc_KSS_shared_Have_one_of_the_following_power_generators
			
			PARAMETER
			{
				name = PartValidationSolar
				type = PartValidation
				// PartModule(s) to check for.  Optional, and can be specified multiple times.
				partModule = ModuleDeployableSolarPanel
				// Minimum count, default = 1
				minCount = 1
				title = #loc_KSS_shared_1_or_more_solar_panels
			}
			
			PARAMETER
			{
				name = PartValidationRTG
				type = PartValidation
				partModule = ModuleGenerator
				minCount = 1
				title = #loc_KSS_shared_1_or_more_generators
			}
			
			PARAMETER:NEEDS[NearFutureSolar]
			{
				name = PartValidationNearFutureSolar
				type = PartValidation
				partModule = ModuleCurvedSolarPanel
				minCount = 1
				title = #loc_KSS_shared_1_or_more_curved_solar_panels
			}

			PARAMETER:NEEDS[NearFutureElectrical]
			{
				name = PartValidationNearFutureReactors
				type = PartValidation
				title = #loc_KSS_shared_1_or_more_fission_reactors
				hideChildren = true
				partModule = FissionReactor
				minCount = 1
			}
		
			PARAMETER:NEEDS[NearFutureElectrical]
			{
				name = PartValidationNearFutureRTGs
				type = PartValidation
				title = #loc_KSS_shared_1_or_more_radioisotope_generators
				hideChildren = true
				partModule = ModuleRadioisotopeGenerator
				minCount = 1
			}

			PARAMETER:NEEDS[Kopernicus]
			{
				name = PartValidationSolar
				type = PartValidation
				title = #loc_KSS_shared_1_or_more_solar_panels
				hideChildren = true
				partModule = KopernicusSolarPanel
				minCount = 1
			}
		}

		PARAMETER
		{
			name = Docking
			type = Docking

			vessel = @/targetVessel1
			title = @/loc_KSS_ReplaceFaultyModule_PARAMETER1_PARAMETER2_title_2_s1 + @/targetVessel1
			completeInSequence = true
		}
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		checkOnActiveContract = false
		contractType = ReplaceFaultyModule
		minCount = 0
		cooldownDuration = 30d
		//title = Must not have completed contract in last 30 days.
	}

	REQUIREMENT
	{
		name = StationCheck
		type = Expression
		checkOnActiveContract = false
		title = #loc_KSS_ReplaceFaultyModule_REQUIREMENT2_title_3
		expression = (@/targetVessel1.IsOrbiting())
	}
	REQUIREMENT
	{
		name = RandomRoll
		type = Expression
		checkOnActiveContract = false
		expression = @BasesandStations:randomRoll <3
		title = #loc_KSS_shared_The_RNG_must_like_you
	}
}
