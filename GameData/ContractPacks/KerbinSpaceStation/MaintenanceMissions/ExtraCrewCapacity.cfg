CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_ExtraCrewCapacity_title_s1 = #loc_KSS_ExtraCrewCapacity_title_s1
		loc_KSS_ExtraCrewCapacity_description_s1 = #loc_KSS_ExtraCrewCapacity_description_s1
		loc_KSS_ExtraCrewCapacity_description_s2 = #loc_KSS_ExtraCrewCapacity_description_s2
		loc_KSS_ExtraCrewCapacity_description_s3 = #loc_KSS_ExtraCrewCapacity_description_s3
		loc_KSS_ExtraCrewCapacity_description_s4 = #loc_KSS_ExtraCrewCapacity_description_s4
		loc_KSS_ExtraCrewCapacity_synopsis_s1 = #loc_KSS_ExtraCrewCapacity_synopsis_s1
		loc_KSS_ExtraCrewCapacity_synopsis_s2 = #loc_KSS_ExtraCrewCapacity_synopsis_s2
		loc_KSS_ExtraCrewCapacity_synopsis_s3 = #loc_KSS_ExtraCrewCapacity_synopsis_s3
		loc_KSS_ExtraCrewCapacity_completedMessage_s1 = #loc_KSS_ExtraCrewCapacity_completedMessage_s1
		loc_KSS_ExtraCrewCapacity_completedMessage_s2 = #loc_KSS_ExtraCrewCapacity_completedMessage_s2
		loc_KSS_ExtraCrewCapacity_PARAMETER2_title_3_s1 = #loc_KSS_ExtraCrewCapacity_PARAMETER2_title_3_s1
		loc_KSS_ExtraCrewCapacity_PARAMETER3_title_4_s1 = #loc_KSS_ExtraCrewCapacity_PARAMETER3_title_4_s1
		loc_KSS_ExtraCrewCapacity_PARAMETER3_title_4_s2 = #loc_KSS_ExtraCrewCapacity_PARAMETER3_title_4_s2
	}

    name = ExtraCrewCapacity
    title = @/loc_KSS_ExtraCrewCapacity_title_s1 + @/targetVessel1
	genericTitle = #loc_KSS_ExtraCrewCapacity_genericTitle
    group = BasesandStations
	description = @/loc_KSS_ExtraCrewCapacity_description_s1 + @/targetKerbal1 + @/loc_KSS_ExtraCrewCapacity_description_s2 + @/targetKerbal2 + @/loc_KSS_ExtraCrewCapacity_description_s3 + @/targetVessel1 + @/loc_KSS_ExtraCrewCapacity_description_s4
	genericDescription = #loc_KSS_ExtraCrewCapacity_genericDescription
    synopsis = @/loc_KSS_ExtraCrewCapacity_synopsis_s1 + @/targetVessel1 + @/loc_KSS_ExtraCrewCapacity_synopsis_s2 + @/Counter + @/loc_KSS_ExtraCrewCapacity_synopsis_s3
    completedMessage = @/loc_KSS_ExtraCrewCapacity_completedMessage_s1 + @/targetKerbal1 + @/loc_KSS_ExtraCrewCapacity_completedMessage_s2
    minExpiry = 1
    maxExpiry = 7
    cancellable = true
    declinable = true
    rewardScience = 0.0
    rewardReputation = 1.0
    rewardFunds = Random(40000.0, 60000)
    failureReputation = 1.0
    failureFunds = 10000.0
    advanceFunds = 10000.0
	targetBody = @/targetBody1
	//find a Station
	    DATA
    {
        type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
        targetVessel1 = AllVessels().Where(v => v.VesselType() == Station && v.EmptyCrewSpace()<4).SelectUnique()
		title = #loc_KSS_ExtraCrewCapacity_DATA1_title
    }
	//Who's complaining?
	DATA
	{
		type = Kerbal
		uniquenessCheck = CONTRACT_ACTIVE
		requiredValue = true
		targetKerbal1 = @targetVessel1.Crew().Random()
		hidden = true
	}
	//Who smells?
	DATA
	{
		type = Kerbal
		uniquenessCheck = CONTRACT_ACTIVE
		requiredValue = true
		hidden = true
		targetKerbal2 = @targetVessel1.Crew().Random()
	}

	DATA
	{
	type = int
	Counter = @targetVessel1.CrewCapacity()+4
	}
	DATA
	{
	type = CelestialBody
	requiredValue = true
	targetBody1 = @/targetVessel1.CelestialBody()
	hidden = true
	}
	
	PARAMETER
	{
	name = HasCrewCapacity
	type = HasCrewCapacity
	minCapacity = 4
	title = #loc_KSS_ExtraCrewCapacity_PARAMETER1_title_2
	hideChildren = true
	}
	PARAMETER
	{
	name = Docking
	type = Docking
	vessel = @/targetVessel1
	title = @/loc_KSS_ExtraCrewCapacity_PARAMETER2_title_3_s1 + @/targetVessel1
	hideChildren = true
	completeInSequence = true
	}
	PARAMETER
	{
	name = All
	type = All
	hideChildren = true
	title = @/loc_KSS_ExtraCrewCapacity_PARAMETER3_title_4_s1 + @/targetKerbal1 + @/loc_KSS_ExtraCrewCapacity_PARAMETER3_title_4_s2
	optional = true
	PARAMETER
	{
    name = VesselIsType
    type = VesselIsType
	
	optional = true
	hideChildren = true
	vesselType = EVA
	}
	PARAMETER
	{
	name = HasCrew
	type = HasCrew
	kerbal = @/targetKerbal1
	}
	}
	}