CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_SurfaceSample_title_s1 = #loc_KSS_SurfaceSample_title_s1
		loc_KSS_SurfaceSample_title_s2 = #loc_KSS_SurfaceSample_title_s2
		loc_KSS_SurfaceSample_synopsis_s1 = #loc_KSS_SurfaceSample_synopsis_s1
		loc_KSS_SurfaceSample_synopsis_s2 = #loc_KSS_SurfaceSample_synopsis_s2
		loc_KSS_SurfaceSample_PARAMETER1_title_4_s1 = #loc_KSS_SurfaceSample_PARAMETER1_title_4_s1
		loc_KSS_SurfaceSample_PARAMETER1_title_4_s2 = #loc_KSS_SurfaceSample_PARAMETER1_title_4_s2
		loc_KSS_SurfaceSample_PARAMETER1_PARAMETER2_title_s1 = #loc_KSS_SurfaceSample_PARAMETER1_PARAMETER2_title_s1
	}

	// Unique name of the contract type (required)
	name = SurfaceSample
	// Contract text details
	title = @/loc_KSS_SurfaceSample_title_s1 + @/biome1 + @/loc_KSS_SurfaceSample_title_s2 + @/targetVessel1
	genericTitle = #loc_KSS_SurfaceSample_genericTitle
	description = #loc_KSS_SurfaceSample_description
	group = BasesandStations
	synopsis = @/loc_KSS_SurfaceSample_synopsis_s1 + @/biome1 + @/loc_KSS_SurfaceSample_synopsis_s2 + @/targetVessel1
	completedMessage = #loc_KSS_SurfaceSample_completedMessage
	notes = #loc_KSS_SurfaceSample_notes
	minExpiry = 1
	maxExpiry = 7
	cancellable = true
	declinable = true
	maxSimultaneous = 1
	rewardScience = 0
	rewardReputation = Random(1.0, 100.0)
	rewardFunds = Random(40000.0, 60000.0)
	failureReputation = Random(1.0, 100.0)
	failureFunds = 10000.0
	advanceFunds = 10000.0
	targetBody = @/targetBody1

	//find me a Station
	DATA
	{
		type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
		targetVessel1 = AllVessels().Where(v => v.VesselType() == Station && v.CrewCount()>0).SelectUnique()
		title = #loc_KSS_shared_Must_have_a_station_with_crew
	}
	//Find out where the Vessel is (needed to make sure that rewards scale correctly)
	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @targetVessel1.CelestialBody()
		hidden = true
	}

	//logic to try and make it not selected a drained biome.
	DATA
	{
		type = Biome
		requiredValue = true
		uniquenessCheck = GROUP_ACTIVE
		biome1 = @targetBody1.Biomes().Where(b => b.RemainingScience() >20).SelectUnique()
		title = #loc_KSS_SurfaceSample_DATA3_title_2
	}

	//See if the player has returned a surface sample.
	DATA
	{
		type = ScienceSubject
		requiredValue = true
		uniquenessCheck = GROUP_ALL
		experiment1 = AllScienceSubjectsByBiome([@biome1]).Where(s => s.Experiment() == surfaceSample && s.CollectedScience() <1).First()
		title = #loc_KSS_SurfaceSample_DATA4_title_3
	}

	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		vessel = @/targetVessel1
		title = @/loc_KSS_SurfaceSample_PARAMETER1_title_4_s1 + @/experiment1 + @/loc_KSS_SurfaceSample_PARAMETER1_title_4_s2 + @/targetVessel1.

		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			subject = @/experiment1
		}

		PARAMETER
		{
			name = Labs
			type = Any	
			hideChildren = true
			title = @/loc_KSS_SurfaceSample_PARAMETER1_PARAMETER2_title_s1 + @/targetVessel1

			PARAMETER
			{
				name = StockLab
				type = PartValidation
				hideChildren = true
				partModule = ModuleScienceLab
			}

			PARAMETER:NEEDS[StationScience]
			{
				name = StationScience
				type = PartValidation
				hideChildren = true
				partModule = SampleAnalyzer
			}
		}
	}


	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = SurfaceSample	
		minCount = 0
		cooldownDuration = 30d
	}

	REQUIREMENT:NEEDS[StationScience]
	{
		name = PartModuleUnlocked
		type = PartModuleUnlocked
		partModule = SampleAnalyzer
	}

	REQUIREMENT
	{
		name = HomeWorldCheck
		type = Expression
		expression = (!@/targetBody1.IsHomeWorld())
		title = #loc_KSS_SurfaceSample_REQUIREMENT2_title_5
	}

	REQUIREMENT
	{
		name = PartModuleUnlocked
		type = PartModuleUnlocked
		partModule = ModuleScienceLab
	}
	
	REQUIREMENT
{
	name = RandomRoll
	type = Expression
	checkOnActiveContract = false
	expression = @BasesandStations:randomRoll > 5
	title = #loc_KSS_shared_The_RNG_must_like_you_0f2a
}
}