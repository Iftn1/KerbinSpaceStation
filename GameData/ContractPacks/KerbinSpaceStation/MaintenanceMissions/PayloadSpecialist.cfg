CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_PayloadSpecialist_title_s1 = #loc_KSS_PayloadSpecialist_title_s1
		loc_KSS_PayloadSpecialist_description_s1 = #loc_KSS_PayloadSpecialist_description_s1
		loc_KSS_PayloadSpecialist_description_s2 = #loc_KSS_PayloadSpecialist_description_s2
		loc_KSS_PayloadSpecialist_description_s3 = #loc_KSS_PayloadSpecialist_description_s3
		loc_KSS_PayloadSpecialist_synopsis_s1 = #loc_KSS_PayloadSpecialist_synopsis_s1
		loc_KSS_PayloadSpecialist_completedMessage_s1 = #loc_KSS_PayloadSpecialist_completedMessage_s1
		loc_KSS_PayloadSpecialist_completedMessage_s2 = #loc_KSS_PayloadSpecialist_completedMessage_s2
		loc_KSS_PayloadSpecialist_completedMessage_s3 = #loc_KSS_PayloadSpecialist_completedMessage_s3
		loc_KSS_PayloadSpecialist_PARAMETER1_title_2_s1 = #loc_KSS_PayloadSpecialist_PARAMETER1_title_2_s1
		loc_KSS_PayloadSpecialist_PARAMETER2_preWaitText_s1 = #loc_KSS_PayloadSpecialist_PARAMETER2_preWaitText_s1
		loc_KSS_PayloadSpecialist_PARAMETER2_preWaitText_s2 = #loc_KSS_PayloadSpecialist_PARAMETER2_preWaitText_s2
		loc_KSS_PayloadSpecialist_PARAMETER2_waitingText_s1 = #loc_KSS_PayloadSpecialist_PARAMETER2_waitingText_s1
		loc_KSS_PayloadSpecialist_PARAMETER2_completionText_s1 = #loc_KSS_PayloadSpecialist_PARAMETER2_completionText_s1
		loc_KSS_PayloadSpecialist_PARAMETER2_completionText_s2 = #loc_KSS_PayloadSpecialist_PARAMETER2_completionText_s2
	}

    name = PayloadSpecialist
    title = @/loc_KSS_PayloadSpecialist_title_s1 + @/targetVessel1
	genericTitle = #loc_KSS_PayloadSpecialist_genericTitle
    group = BasesandStations
	description = @/loc_KSS_PayloadSpecialist_description_s1 + @/brokenPart + @/loc_KSS_PayloadSpecialist_description_s2 + @/targetVessel1 + @/loc_KSS_PayloadSpecialist_description_s3
	genericDescription = #loc_KSS_PayloadSpecialist_genericDescription
    synopsis = @/loc_KSS_PayloadSpecialist_synopsis_s1 + @/targetVessel1
    completedMessage = @/loc_KSS_PayloadSpecialist_completedMessage_s1 + @/targetVessel1 + @/loc_KSS_PayloadSpecialist_completedMessage_s2 + @/brokenPart + @/loc_KSS_PayloadSpecialist_completedMessage_s3
    minExpiry = 1
    maxExpiry = 7
    cancellable = true
    declinable = true
    rewardScience = 0.0
    rewardReputation = 1.0
    rewardFunds = Random(40000.0, 60000)
    failureReputation = 1.0
    failureFunds = 10000.0
    advanceFunds = 10000.0
	targetBody = @/targetBody1

	DATA
    {
        type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
        targetVessel1 = AllVessels().Where(v => v.VesselType() == Station && v.CrewCount()>0).Random()
		title = #loc_KSS_shared_Must_have_a_space_station_with_crew_in_orbit
    }
	
	DATA
	{
		type = CelestialBody
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}
	
	DATA
	{
		type = List<string>
		brokenList = [ "Solar Panel", "Batteries", "Life Support", "Science Module", "Airlock" ]
		hidden = true
	}
	
	DATA
	{
		type = string
		brokenPart = @/brokenList.Random()
		hidden = true
	}
	
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		count = 1
		kerbalType = Unowned
		removePassengers = true
	}

	PARAMETER
	{
		name = StationCheck
		type = VesselParameterGroup
		vessel = @/targetVessel1
		title = @/loc_KSS_PayloadSpecialist_PARAMETER1_title_2_s1 + @/targetVessel1
		hideChildren = true
		
		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			index = 0
		}
	}

	PARAMETER
	{
		name = Duration
		type = Duration
		duration = 7d
		preWaitText = @/loc_KSS_PayloadSpecialist_PARAMETER2_preWaitText_s1 + @/brokenPart + @/loc_KSS_PayloadSpecialist_PARAMETER2_preWaitText_s2
		waitingText = @/loc_KSS_PayloadSpecialist_PARAMETER2_waitingText_s1 + @/brokenPart
		completionText = @/loc_KSS_PayloadSpecialist_PARAMETER2_completionText_s1 + @/brokenPart + @/loc_KSS_PayloadSpecialist_PARAMETER2_completionText_s2
		startCriteria = PARAMETER_COMPLETION
		parameter = StationCheck
	}
		

	PARAMETER
	{
		name = RecoverKerbal
		type = RecoverKerbal
		completeInSequence = true
	}

	REQUIREMENT
	{
		name = Expression
		type = Expression
		checkOnActiveContract = false
		expression = @BasesandStations:randomRoll <3
		title = #loc_KSS_shared_The_RNG_must_like_you
	}
}


