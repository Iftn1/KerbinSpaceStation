CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_RepairFaultyModule_title_s1 = #loc_KSS_RepairFaultyModule_title_s1
		loc_KSS_shared_Telemetry_indicates_that_the_power_module_on = #loc_KSS_shared_Telemetry_indicates_that_the_power_module_on
		loc_KSS_RepairFaultyModule_description_s2 = #loc_KSS_RepairFaultyModule_description_s2
		loc_KSS_RepairFaultyModule_PARAMETER1_PARAMETER1_PARAMETER1_title_s1 = #loc_KSS_RepairFaultyModule_PARAMETER1_PARAMETER1_PARAMETER1_title_s1
	}

    name = RepairFaultyModule
    title = @/loc_KSS_RepairFaultyModule_title_s1 + @/targetVessel1
	genericTitle = #loc_KSS_RepairFaultyModule_genericTitle
    description = @/loc_KSS_shared_Telemetry_indicates_that_the_power_module_on + @/targetVessel1 + @/loc_KSS_RepairFaultyModule_description_s2
	genericDescription = #loc_KSS_RepairFaultyModule_genericDescription
    synopsis = #loc_KSS_RepairFaultyModule_synopsis
    completedMessage = #loc_KSS_RepairFaultyModule_completedMessage
    minExpiry = 1
    maxExpiry = 7
	group = BasesandStations
    cancellable = true
    declinable = true
    rewardScience = 0
    rewardReputation = Random(1.0, 20.0)
    rewardFunds = Random(40000, 60000.0)
    failureReputation = Random(1.0, 10.0)
    failureFunds = Random(1.0, 10000.0)
    advanceFunds = Random(1.0, 10000.0)
	targetBody = @targetBody1
	
	DATA
    {
        type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
        targetVessel1 = AllVessels().Where(v => v.VesselType() == Station && v.CrewCount()>0).SelectUnique()
		title = #loc_KSS_shared_Must_have_a_space_station_with_crew_in_orbit
    }
	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}

	PARAMETER
	{
		name = Sequence
		type = Sequence
		hiddenParameter = Engineer
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			
			vessel = @/targetVessel1

			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				trait = Engineer
				title = @/loc_KSS_RepairFaultyModule_PARAMETER1_PARAMETER1_PARAMETER1_title_s1 + @/targetVessel1
			}
		}
		PARAMETER
		{
			name = Engineer
			type = All

			PARAMETER
			{
				name = VesselIsType
				type = VesselIsType
				vesselType = EVA
			}
			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				trait = Engineer 
			}
		}
	}
	PARAMETER
	{
		name = Duration
		type = Duration
		duration = 2m
		preWaitText = #loc_KSS_shared_Waiting_for_an_Engineer
		waitingText = #loc_KSS_shared_Repair_in_progress
		completionText = #loc_KSS_RepairFaultyModule_PARAMETER2_completionText
		completeInSequence = true
	}

	REQUIREMENT
	{
		name = Tier3
		type = CompleteContract
		contractType = RepairFaultyModule
		checkOnActiveContract = false
		minCount = 0
		cooldownDuration = 15d
		//title = Must not have completed contract in last 15 days.
	}
	
	REQUIREMENT
	{
		name = StationCheck
		type = Expression
		checkOnActiveContract = false
		expression = (@/targetVessel1.IsOrbiting())
		title = #loc_KSS_shared_The_station_should_be_in_orbit
	}
	
	REQUIREMENT
	{
		name = RandomRoll
		type = Expression
		checkOnActiveContract = false
		expression = @BasesandStations:randomRoll <3
		title = #loc_KSS_shared_The_RNG_must_like_you
	}
}