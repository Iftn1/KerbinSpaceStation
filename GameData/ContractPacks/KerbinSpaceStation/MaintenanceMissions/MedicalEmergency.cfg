CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_MedicalEmergency_title_s1 = #loc_KSS_MedicalEmergency_title_s1
		loc_KSS_MedicalEmergency_description_s1 = #loc_KSS_MedicalEmergency_description_s1
		loc_KSS_MedicalEmergency_description_s2 = #loc_KSS_MedicalEmergency_description_s2
		loc_KSS_MedicalEmergency_synopsis_s1 = #loc_KSS_MedicalEmergency_synopsis_s1
		loc_KSS_MedicalEmergency_synopsis_s2 = #loc_KSS_MedicalEmergency_synopsis_s2
		loc_KSS_MedicalEmergency_synopsis_s3 = #loc_KSS_MedicalEmergency_synopsis_s3
		loc_KSS_MedicalEmergency_completedMessage_s1 = #loc_KSS_MedicalEmergency_completedMessage_s1
		loc_KSS_MedicalEmergency_completedMessage_s2 = #loc_KSS_MedicalEmergency_completedMessage_s2
		loc_KSS_MedicalEmergency_PARAMETER1_title_3_s1 = #loc_KSS_MedicalEmergency_PARAMETER1_title_3_s1
	}

    //Credits to Severedsolo
    name = MedicalEmergency
    title = @/loc_KSS_MedicalEmergency_title_s1 + @/targetVessel1
	genericTitle = #loc_KSS_MedicalEmergency_genericTitle
    group = BasesandStations
	description = @/loc_KSS_MedicalEmergency_description_s1 + @/targetKerbal1 + @/loc_KSS_MedicalEmergency_description_s2
	genericDescription = #loc_KSS_MedicalEmergency_genericDescription
    synopsis = @/loc_KSS_MedicalEmergency_synopsis_s1 + @/targetKerbal1 + @/loc_KSS_MedicalEmergency_synopsis_s2 + @/homeworld + @/loc_KSS_MedicalEmergency_synopsis_s3
    completedMessage = @/loc_KSS_MedicalEmergency_completedMessage_s1 + @/targetKerbal1 + @/loc_KSS_MedicalEmergency_completedMessage_s2
    minExpiry = 1
    maxExpiry = 7
	maxSimultaneous = 1
    cancellable = false
    declinable = true
    rewardScience = 0.0
    rewardReputation = Random(1, 2)
    rewardFunds = Random(40000, 60000.0)
    failureReputation = 1
    failureFunds = Random(1000, 10000.0)
    advanceFunds = Random(1000, 10000.0)
	targetBody = @/targetBody1
    
	DATA
    {
        type = Vessel
		requiredValue = true
		title = #loc_KSS_MedicalEmergency_DATA1_title
		uniquenessCheck = GROUP_ACTIVE
		targetVessel1 = AllVessels().Where(v => ((v.IsLanded() && v.VesselType()== Base) || (v.VesselType() == Station)) && v.CrewCount()>= 1).Random()
    }
	
	DATA
	{
        type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
    }
	
	DATA
	{
        type = CelestialBody
		requiredValue = true
		homeworld = HomeWorld()
		hidden = true
    }
	
	DATA
	{
		type = Kerbal
		uniquenessCheck = GROUP_ACTIVE
		targetKerbal1 = @targetVessel1.Crew().Random()
		title = #loc_KSS_MedicalEmergency_DATA4_title_2
	} 
	
	PARAMETER
	{
		name = RecoverKerbal
		type = RecoverKerbal
		kerbal = @/targetKerbal1
		title = @/loc_KSS_MedicalEmergency_PARAMETER1_title_3_s1 + @/targetKerbal1
	}
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MedicalEmergency
		minCount = 0
		cooldownDuration = 10d
	}

	// REQUIREMENT
	// {
		// name = CompleteContract
		// type = Expression
		// expression = (!@/targetBody1.IsHomeWorld() && !@/targetKerbal1.RosterStatus()==Available)
		// title = The Kerbal to be recovered should not be available in the Roster.
	// }
	
	REQUIREMENT
	{
		name = RandomRoll
		type = Expression
		checkOnActiveContract = false
		expression = @BasesandStations:randomRoll <3
		title = #loc_KSS_shared_The_RNG_must_like_you
	}
}