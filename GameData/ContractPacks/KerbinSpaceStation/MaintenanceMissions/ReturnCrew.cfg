CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_shared_Take_the_crew_of = #loc_KSS_shared_Take_the_crew_of
		loc_KSS_ReturnCrew_title_s2 = #loc_KSS_ReturnCrew_title_s2
		loc_KSS_ReturnCrew_synopsis_s2 = #loc_KSS_ReturnCrew_synopsis_s2
		loc_KSS_ReturnCrew_synopsis_s3 = #loc_KSS_ReturnCrew_synopsis_s3
		loc_KSS_ReturnCrew_PARAMETER1_PARAMETER1_title_s1 = #loc_KSS_ReturnCrew_PARAMETER1_PARAMETER1_title_s1
		loc_KSS_ReturnCrew_PARAMETER1_PARAMETER1_title_s2 = #loc_KSS_ReturnCrew_PARAMETER1_PARAMETER1_title_s2
	}

    name = ReturnCrew
    title = @/loc_KSS_shared_Take_the_crew_of + @/targetVessel1 + @/loc_KSS_ReturnCrew_title_s2 + @/targetVessel2
	genericTitle = #loc_KSS_ReturnCrew_genericTitle
	description = #loc_KSS_ReturnCrew_description
    group = BasesandStations
    synopsis = @/loc_KSS_shared_Take_the_crew_of + @/targetVessel1 + @/loc_KSS_ReturnCrew_synopsis_s2 + @/targetVessel2 + @/loc_KSS_ReturnCrew_synopsis_s3
	completedMessage = #loc_KSS_ReturnCrew_completedMessage
    minExpiry = 1
    maxExpiry = 7
    cancellable = true
    declinable = true
    rewardScience = 0
	maxSimultaneous = 1
    rewardReputation = 1.0
    rewardFunds = Random(40000, 60000.0)
    failureFunds = Random(1,10000.0)
    advanceFunds = Random(1,10000.0)
	targetBody = @/targetBody1
	//find a ServiceModule
	DATA
    {
        type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
        targetVessel1 = [ServiceModule].Where(a => a.IsLanded() || a.IsSplashed()).Random()
		title = #loc_KSS_ReturnCrew_DATA1_title
    }
	//Find me a station!
    DATA
    {
        type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
        targetVessel2 = AllVessels().Where(v => v.VesselType() == Station).Where(v => v.CelestialBody() == @targetBody1 && v.EmptyCrewSpace() >= @targetVessel1.CrewCount()).Random()
		title = #loc_KSS_ReturnCrew_DATA2_title_2
    }
	
	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @targetVessel1.CelestialBody()
		hidden = true
	}
	
PARAMETER
{
    name = VesselParameterGroup
    type = VesselParameterGroup
	vessel = @/targetVessel1
    PARAMETER
	{
		name = Docking
		type = Docking
		vessel = @/targetVessel2
		title = @/loc_KSS_ReturnCrew_PARAMETER1_PARAMETER1_title_s1 + @/targetVessel1 + @/loc_KSS_ReturnCrew_PARAMETER1_PARAMETER1_title_s2 + @/targetVessel2
		disableOnStateChange = true
	}
}
}