CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_Evacuate_title_s1 = #loc_KSS_Evacuate_title_s1
		loc_KSS_Evacuate_description_s1 = #loc_KSS_Evacuate_description_s1
		loc_KSS_Evacuate_description_s2 = #loc_KSS_Evacuate_description_s2
		loc_KSS_Evacuate_synopsis_s1 = #loc_KSS_Evacuate_synopsis_s1
		loc_KSS_Evacuate_PARAMETER1_title_2_s1 = #loc_KSS_Evacuate_PARAMETER1_title_2_s1
		loc_KSS_Evacuate_PARAMETER1_PARAMETER1_title_s1 = #loc_KSS_Evacuate_PARAMETER1_PARAMETER1_title_s1
		loc_KSS_Evacuate_PARAMETER2_title_3_s1 = #loc_KSS_Evacuate_PARAMETER2_title_3_s1
	}

    // Unique name of the contract type (required)
    name = Evacuate
    title = @/loc_KSS_Evacuate_title_s1 + @/targetVessel1
	genericTitle = #loc_KSS_Evacuate_genericTitle
    group = BasesandStations
    description = @/loc_KSS_Evacuate_description_s1 + @/targetVessel1. + @/loc_KSS_Evacuate_description_s2
	genericDescription =  #loc_KSS_Evacuate_genericDescription
    synopsis = @/loc_KSS_Evacuate_synopsis_s1 + @/targetVessel1
    completedMessage = #loc_KSS_Evacuate_completedMessage
    minExpiry = 1
    maxExpiry = 30
    deadline = 500
    cancellable = false
    declinable = false
    prestige = Significant
    rewardScience = 0.0
    rewardReputation = Random(1, 20.0)
    rewardFunds = @/targetVessel1.CrewCount() >4 ? @/targetVessel1.CrewCount()*10000 : Random(40000, 60000.0)
    failureReputation = Random(1, 10.0)
    failureFunds = Random(1, 10000.0)
    advanceFunds = Random(1, 10000.0)
	targetBody = @/targetBody1
		
	    DATA
    {
        type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
        targetVessel1 = AllVessels().Where(v => v.VesselType() == Station && v.CrewCount()>0).SelectUnique()
		title = #loc_KSS_Evacuate_DATA1_title
    }
  DATA
    {
        type = List<Kerbal>

        // Get me some Kerbals to send home!
        StationCrew = @targetVessel1.Crew()
		hidden = true
    }

	DATA
	{
	type = CelestialBody
	requiredValue = true
	targetBody1 = @targetVessel1.CelestialBody()
	hidden = true
	}
	
	PARAMETER
	{
    name = VesselParameterGroup
    type = VesselParameterGroup
    title = @/loc_KSS_Evacuate_PARAMETER1_title_2_s1 + @/targetVessel1
    vessel = @/targetVessel1
	
		PARAMETER
		{
        name = HasCrew
        type = HasCrew
		minCrew = 0
		maxCrew = 0
		title = @/loc_KSS_Evacuate_PARAMETER1_PARAMETER1_title_s1 + @/targetVessel1.
		 }
	}
	
	PARAMETER
	{
    name = VesselParameterGroup
    type = VesselParameterGroup
    title = @/loc_KSS_Evacuate_PARAMETER2_title_3_s1 + @/targetBody1
	completeInSequence = true
    define = ServiceModule
		PARAMETER
		{
		name = All
		type = All
			PARAMETER
			{
			name = HasCrew
			type = HasCrew
			kerbal = @/StationCrew
			}
			PARAMETER
			{
			name = Any
			type = Any
				PARAMETER
				{
				name = Land
				type = ReachState
				targetBody = @/targetBody1
				situation = LANDED
				}
				PARAMETER
				{
				name = Land
				type = ReachState
				targetBody = @/targetBody1
				situation = SPLASHED
				}
			}
		}
	REQUIREMENT
	{
    name = HasSurface
    type = Expression
	expression = @/targetBody1.HasSurface()
	}
}
REQUIREMENT
{
    name = CompleteContract
    type = CompleteContract
	contractType = Evacuate
	minCount = 0
	checkOnActiveContract = false
	cooldownDuration = 10d
}
	REQUIREMENT
	{
    name = RandomRoll
    type = Expression
	checkOnActiveContract = false
	expression = @BasesandStations:randomRoll < 3
	title = #loc_KSS_shared_The_RNG_must_like_you
	}
}