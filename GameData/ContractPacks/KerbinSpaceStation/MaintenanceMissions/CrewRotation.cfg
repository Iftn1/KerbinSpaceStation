CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_CrewRotation_title_s1 = #loc_KSS_CrewRotation_title_s1
		loc_KSS_CrewRotation_description_s1 = #loc_KSS_CrewRotation_description_s1
		loc_KSS_CrewRotation_synopsis_s1 = #loc_KSS_CrewRotation_synopsis_s1
		loc_KSS_CrewRotation_PARAMETER1_PARAMETER1_title_s1 = #loc_KSS_CrewRotation_PARAMETER1_PARAMETER1_title_s1
	}

    // Unique name of the contract type (required)
    name = CrewRotation
    title = @/loc_KSS_CrewRotation_title_s1 + @/targetVessel1
	genericTitle = #loc_KSS_CrewRotation_genericTitle
	group = BasesandStations
    description = @/loc_KSS_CrewRotation_description_s1 + @/targetVessel1.
	genericDescription = #loc_KSS_CrewRotation_genericDescription
    synopsis = @/loc_KSS_CrewRotation_synopsis_s1 + @/targetVessel1.
    completedMessage = #loc_KSS_CrewRotation_completedMessage
    
	minExpiry = 1
    maxExpiry = 7
    
	cancellable = true
    declinable = true
    maxSimultaneous = 1
	
	rewardScience = 0.0
    rewardReputation = Random(1, 5.0)
    rewardFunds = @/targetVessel1.CrewCount() >4 ? @/targetVessel1.CrewCount()*10000 : Random(40000, 60000.0)
    failureReputation = Random(1, 5.0)
    failureFunds = Random(1, 10000.0)
    advanceFunds = Random(1, 10000.0)
	
	targetBody = @/targetBody1
	
	DATA
    {
        type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
        targetVessel1 = AllVessels().Where(v => v.VesselType() == Station && v.CrewCount()>0).SelectUnique()
		title = #loc_KSS_CrewRotation_DATA1_title
    }
	
	
	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}
	DATA
    {
        type = List<Kerbal>

        // Get me some Kerbals to send home!
        targetKerbals = @targetVessel1.Crew()
		hidden = true
    }


	PARAMETER
	{
		name = Rotation
		type = VesselParameterGroup
		title = #loc_KSS_CrewRotation_PARAMETER1_title_2
 
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = @/targetVessel1
			title = @/loc_KSS_CrewRotation_PARAMETER1_PARAMETER1_title_s1 + @/targetVessel1
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = Random(1, 4)
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			trait = Engineer
			disableOnStateChange = true
			hideChildren = true
			title = #loc_KSS_CrewRotation_PARAMETER1_PARAMETER3_title_2
		}
	}
PARAMETER
{
    name = ReturnHome
    type = ReturnHome
    title = #loc_KSS_CrewRotation_PARAMETER2_title_3
	completeInSequence = true
}
PARAMETER
{
    name = RecoverKerbal
    type = RecoverKerbal
	kerbal = @/targetKerbals
}
	REQUIREMENT
	{
	name = StationCheck
	type = Expression
	expression = (@/targetVessel1.IsOrbiting())
	title = #loc_KSS_CrewRotation_REQUIREMENT1_title_4
	}
	
REQUIREMENT
{
name = CompleteContract
type = CompleteContract
minCount = 0
contractType = CrewRotation
cooldownDuration = 10d
}

REQUIREMENT
{
	name = Expression
	type = Expression
	checkOnActiveContract = false
	expression = @BasesandStations:randomRoll >5
	title = #loc_KSS_shared_The_RNG_must_like_you
}
}