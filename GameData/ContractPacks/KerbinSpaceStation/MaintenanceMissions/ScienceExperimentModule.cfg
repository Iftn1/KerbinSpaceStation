CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_ScienceExperimentModule_title_s1 = #loc_KSS_ScienceExperimentModule_title_s1
		loc_KSS_shared_while_docked_with = #loc_KSS_shared_while_docked_with
		loc_KSS_ScienceExperimentModule_description_s1 = #loc_KSS_ScienceExperimentModule_description_s1
		loc_KSS_ScienceExperimentModule_description_s2 = #loc_KSS_ScienceExperimentModule_description_s2
		loc_KSS_ScienceExperimentModule_synopsis_s1 = #loc_KSS_ScienceExperimentModule_synopsis_s1
		loc_KSS_ScienceExperimentModule_synopsis_s3 = #loc_KSS_ScienceExperimentModule_synopsis_s3
		loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER1_title_s1 = #loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER1_title_s1
		loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER2_title_2_s1 = #loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER2_title_2_s1
		loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER2_title_2_s2 = #loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER2_title_2_s2
		loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER2_title_2_s3 = #loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER2_title_2_s3
	}

	// Unique name of the contract type (required)
	name = ScienceExperimentModule
	// Contract text details
	title = @/loc_KSS_ScienceExperimentModule_title_s1 + @/experimentToPerform + @/loc_KSS_shared_while_docked_with + @/targetVessel1
	genericTitle = #loc_KSS_ScienceExperimentModule_genericTitle
	description = @/loc_KSS_ScienceExperimentModule_description_s1 + @/experimentToPerform. + @/loc_KSS_ScienceExperimentModule_description_s2
	genericDescription = #loc_KSS_ScienceExperimentModule_genericDescription
	synopsis = @/loc_KSS_ScienceExperimentModule_synopsis_s1 + @/experimentToPerform + @/loc_KSS_shared_while_docked_with + @/targetVessel1 + @/loc_KSS_ScienceExperimentModule_synopsis_s3
	completedMessage = #loc_KSS_ScienceExperimentModule_completedMessage
	minExpiry = 1
	maxExpiry = 30
	cancellable = true
	declinable = true
	group = BasesandStations
	maxSimultaneous = 1
	rewardScience = @/scienceSubject.CollectedScience() * 1.5
	rewardReputation = Random(1.0, 100.0)
	rewardFunds = 0.0
	failureReputation = Random(1.0, 100.0)
	failureFunds = 0.0
	advanceFunds = ((@/scienceSubject.CollectedScience() * 1000)*-1) - Random(5000.0, 10000.0)
	targetBody = @/targetBody1
	prestige = Trivial

	DATA
	{
		type = Vessel
		uniquenessCheck = CONTRACT_ACTIVE
		requiredValue = true
		targetVessel1 = AllVessels().Where(v => v.VesselType() == Station && v.CrewCount()>0).Random()
		title = #loc_KSS_shared_Must_have_a_station_with_crew
	}
	
	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}
	
	DATA
	{
		type = List<ScienceSubject>
		hidden = true
		
		TempSub1 = AllScienceSubjectsByBody([@targetBody]).Where(v => v.Situation() == InSpaceLow)
		TempSub2 = @TempSub1.Where(v => v.Experiment() != evaReport && v.Experiment() != crewReport)
		TempSub3 = @TempSub2.Where(v => v.CollectedScience() > 0)
		
	}

	DATA
	{
		type = ScienceSubject
		hidden = true
		uniquenessCheck = CONTRACT_ACTIVE
		scienceSubject = @TempSub3.SelectUnique()
	}

	DATA
    {
        type = ScienceExperiment

        uniquenessCheck = CONTRACT_ACTIVE
        hidden = true

        experimentToPerform = @scienceSubject.Experiment()
    }
	
	PARAMETER
	{
		name = Sequence
		type = Sequence	
		
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = @/targetVessel1
			title = @/loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER1_title_s1 + @/targetVessel1
		}

		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			experiment = @/experimentToPerform
			recoveryMethod = Recover
			hideChildren = true
			title = @/loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER2_title_2_s1 + @/experimentToPerform + @/loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER2_title_2_s2 + @/targetVessel1 + @/loc_KSS_ScienceExperimentModule_PARAMETER1_PARAMETER2_title_2_s3
		}
	}
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = ScienceExperimentModule
		minCount = 0
		checkOnActiveContract = false
		cooldownDuration = 15d
		//title = Must not have completed this contract in the last 15 days.
		
	}
	
	REQUIREMENT
	{
		name = StationCheck
		type = Expression
		checkOnActiveContract = false
		title = #loc_KSS_shared_The_station_should_be_in_orbit
		expression = (@/targetVessel1.IsOrbiting())
	}
	
	REQUIREMENT
	{
		name = RandomRoll
		type = Expression
		checkOnActiveContract = false
		expression = @BasesandStations:randomRoll >5
		title = #loc_KSS_shared_The_RNG_must_like_you_0f2a
	}
}