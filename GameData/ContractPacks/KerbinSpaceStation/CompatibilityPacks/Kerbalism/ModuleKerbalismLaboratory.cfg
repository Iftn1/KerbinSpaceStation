CONTRACT_TYPE:NEEDS[Kerbalism]
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_shared_Add_a_Laboratory_to = #loc_KSS_shared_Add_a_Laboratory_to
		loc_KSS_Laboratory_synopsis_s2 = #loc_KSS_Laboratory_synopsis_s2
		loc_KSS_Laboratory_PARAMETER1_title_2_s1 = #loc_KSS_Laboratory_PARAMETER1_title_2_s1
		loc_KSS_Laboratory_PARAMETER1_title_2_s2 = #loc_KSS_Laboratory_PARAMETER1_title_2_s2
		loc_KSS_Laboratory_PARAMETER2_title_3_s1 = #loc_KSS_Laboratory_PARAMETER2_title_3_s1
	}

    name = Laboratory
    title = @/loc_KSS_shared_Add_a_Laboratory_to + @/targetVessel1
	genericTitle = #loc_KSS_Laboratory_genericTitle
    group = BasesandStations
	description = #loc_KSS_Laboratory_description
	genericDescription = #loc_KSS_shared_How_are_we_gonna_do_science_without_a_lab_huh
    synopsis = @/loc_KSS_shared_Add_a_Laboratory_to + @/targetVessel1 + @/loc_KSS_Laboratory_synopsis_s2
    completedMessage = #loc_KSS_shared_Well_done_Now_we_can_continue_advancing_Kerbal_k
    
	minExpiry = 1
    maxExpiry = 7
    
	cancellable = true
    declinable = true
	maxSimultaneous = 1
    
	rewardScience = 0.0
    rewardReputation = 1.0
    rewardFunds = Random(30000.0, 40000.0)
    failureReputation = 1.0
    failureFunds = 35000.0
    advanceFunds = 35000.0
	
	targetBody = @/targetBody1
	
	//Find a Station without a Laboratory
	DATA
    {
        type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
        targetVessel1 = AllVessels().Where(v => v.Parts().Contains(Large_Crewed_Lab) == false && v.VesselType() == Station && v.CrewCount() > 0).Random()
		title = #loc_KSS_Laboratory_DATA1_title
    }

	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}
	

	PARAMETER
	{
		name = PartValidation
		type = PartValidation
		title = @/loc_KSS_Laboratory_PARAMETER1_title_2_s1 + @/targetVessel1 + @/loc_KSS_Laboratory_PARAMETER1_title_2_s2
		VALIDATE
		{
			partModule = Laboratory
		}
	}

	PARAMETER
	{
		name = Docking
		type = Docking
		vessel = @/targetVessel1
		title = @/loc_KSS_Laboratory_PARAMETER2_title_3_s1 + @/targetVessel1
		hideChildren = true
		completeInSequence = true
	}
	
	REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		checkOnActiveContract = false
		part = Large_Crewed_Lab
	}
}