CONTRACT_TYPE:NEEDS[StationScience]
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_shared_Add_a_TH_NKR_Research_Lab_to = #loc_KSS_shared_Add_a_TH_NKR_Research_Lab_to
		loc_KSS_ResearchLab_description_s1 = #loc_KSS_ResearchLab_description_s1
		loc_KSS_ResearchLab_PARAMETER1_title_2_s1 = #loc_KSS_ResearchLab_PARAMETER1_title_2_s1
		loc_KSS_ResearchLab_PARAMETER2_title_3_s1 = #loc_KSS_ResearchLab_PARAMETER2_title_3_s1
	}

    name = ResearchLab
    title = @/loc_KSS_shared_Add_a_TH_NKR_Research_Lab_to + @/targetVessel1
	genericTitle = #loc_KSS_ResearchLab_genericTitle
    group = BasesandStations
	description = @/loc_KSS_ResearchLab_description_s1 + @/targetVessel1.
	genericDescription = #loc_KSS_ResearchLab_genericDescription
    synopsis = @/loc_KSS_shared_Add_a_TH_NKR_Research_Lab_to + @/targetVessel1.
    completedMessage = #loc_KSS_shared_Well_done_Now_we_can_continue_advancing_Kerbal_k
    
	minExpiry = 1
    maxExpiry = 7
    
	cancellable = true
    declinable = true
	maxSimultaneous = 1
    
	rewardScience = 0.0
    rewardReputation = 1.0
    rewardFunds = Random(35000.0, 45000.0)
    failureReputation = 1.0
    failureFunds = 40000.0
    advanceFunds = 40000.0
	
	targetBody = @/targetBody1
	
	//Find a Station without a TH-NKR Research Lab
	DATA
    {
        type = Vessel
		uniquenessCheck = CONTRACT_ACTIVE
		requiredValue = true
		targetVessel1 = AllVessels().Where(v => v.Parts().Contains(StnSciLab) == false && v.VesselType() == Station && v.CrewCount() > 0 ).SelectUnique()
		//targetVessel2 = @targetVessel1.Where(v => v.Parts().Contains(StnSciLab) == false )
		title = #loc_KSS_ResearchLab_DATA1_title
    }

	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}
	

	PARAMETER
	{
		name = PartValidation
		type = PartValidation
		title = @/loc_KSS_ResearchLab_PARAMETER1_title_2_s1 + @/targetVessel1.
		VALIDATE
		{
			part = StnSciLab
		}
	}

	PARAMETER
	{
		name = Docking
		type = Docking
		vessel = @/targetVessel1
		title = @/loc_KSS_ResearchLab_PARAMETER2_title_3_s1 + @/targetVessel1
		hideChildren = true
		completeInSequence = true
	}
	
	REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		checkOnActiveContract = false
		part = StnSciLab
	}
}