CONTRACT_TYPE:NEEDS[StationScience]
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_shared_Add_a_F_RRY_Zoology_Bay_to = #loc_KSS_shared_Add_a_F_RRY_Zoology_Bay_to
		loc_KSS_ZoologyBay_description_s1 = #loc_KSS_ZoologyBay_description_s1
		loc_KSS_ZoologyBay_description_s2 = #loc_KSS_ZoologyBay_description_s2
		loc_KSS_ZoologyBay_description_s3 = #loc_KSS_ZoologyBay_description_s3
		loc_KSS_ZoologyBay_completedMessage_s1 = #loc_KSS_ZoologyBay_completedMessage_s1
		loc_KSS_ZoologyBay_completedMessage_s2 = #loc_KSS_ZoologyBay_completedMessage_s2
		loc_KSS_ZoologyBay_PARAMETER1_title_2_s1 = #loc_KSS_ZoologyBay_PARAMETER1_title_2_s1
		loc_KSS_ZoologyBay_PARAMETER3_title_4_s1 = #loc_KSS_ZoologyBay_PARAMETER3_title_4_s1
	}

    name = ZoologyBay
    title = @/loc_KSS_shared_Add_a_F_RRY_Zoology_Bay_to + @/targetVessel1
	genericTitle = #loc_KSS_ZoologyBay_genericTitle
    group = BasesandStations
	description = @/loc_KSS_ZoologyBay_description_s1 + @/targetKerbal1 + @/loc_KSS_ZoologyBay_description_s2 + @/targetVessel1 + @/loc_KSS_ZoologyBay_description_s3
	genericDescription = #loc_KSS_ZoologyBay_genericDescription
    synopsis = @/loc_KSS_shared_Add_a_F_RRY_Zoology_Bay_to + @/targetVessel1
    completedMessage = @/loc_KSS_ZoologyBay_completedMessage_s1 + @/targetKerbal1 + @/loc_KSS_ZoologyBay_completedMessage_s2
    
	minExpiry = 1
    maxExpiry = 7
    
	cancellable = true
    declinable = true
	maxSimultaneous = 1
    
	rewardScience = 0.0
    rewardReputation = 1.0
    rewardFunds = Random(40000.0, 50000.0)
    failureReputation = 1.0
    failureFunds = 45000.0
    advanceFunds = 45000.0
	
	targetBody = @/targetBody1
	
	//Find a Station with a Research Lab but without a Zoology Bay
	DATA
    {
        type = Vessel
		uniquenessCheck = CONTRACT_ACTIVE
		requiredValue = true
		targetVessel1 = AllVessels().Where(v => v.Parts().Contains(StnSciZoo) == false && v.Parts().Contains(StnSciLab) == true && v.VesselType() == Station && v.CrewCount() > 0).SelectUnique()
		//targetVessel2 = @targetVessel1.Where(v => v.Parts().Contains(StnSciZoo) == false && v.Parts().Contains(StnSciLab) == true)
		title = #loc_KSS_ZoologyBay_DATA1_title
    }
	
	//Who misses their friend?
	DATA
	{
		type = Kerbal
		uniquenessCheck = CONTRACT_ACTIVE
		requiredValue = true
		targetKerbal1 = @/targetVessel1.Crew().Random()
		hidden = true
	}

	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}
	

	PARAMETER
	{
		name = PartValidation
		type = PartValidation
		title = @/loc_KSS_ZoologyBay_PARAMETER1_title_2_s1 + @/targetVessel1.
		VALIDATE
		{
			part = StnSciZoo
		}
	}
		
	PARAMETER
	{
		name = HasResource
		type = HasResource
		title = #loc_KSS_ZoologyBay_PARAMETER2_title_3
		resource = Kibbal
		minQuantity = 25.0
	}

	PARAMETER
	{
		name = Docking
		type = Docking
		vessel = @/targetVessel1
		title = @/loc_KSS_ZoologyBay_PARAMETER3_title_4_s1 + @/targetVessel1
		hideChildren = true
		completeInSequence = true
	}
	
		REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		checkOnActiveContract = false
		part = StnSciZoo
	}
}