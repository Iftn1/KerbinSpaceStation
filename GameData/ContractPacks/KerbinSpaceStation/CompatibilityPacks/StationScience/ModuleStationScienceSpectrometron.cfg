CONTRACT_TYPE:NEEDS[StationScience]
{

	DATA
	{
		type = string
		hidden = true

		loc_KSS_shared_Add_a_WT_SIT_Spectrometron_to = #loc_KSS_shared_Add_a_WT_SIT_Spectrometron_to
		loc_KSS_Spectrometron_description_s1 = #loc_KSS_Spectrometron_description_s1
		loc_KSS_Spectrometron_description_s2 = #loc_KSS_Spectrometron_description_s2
		loc_KSS_Spectrometron_PARAMETER1_title_2_s1 = #loc_KSS_Spectrometron_PARAMETER1_title_2_s1
		loc_KSS_Spectrometron_PARAMETER1_title_2_s2 = #loc_KSS_Spectrometron_PARAMETER1_title_2_s2
		loc_KSS_Spectrometron_PARAMETER2_title_3_s1 = #loc_KSS_Spectrometron_PARAMETER2_title_3_s1
	}

    name = Spectrometron
    title = @/loc_KSS_shared_Add_a_WT_SIT_Spectrometron_to + @/targetVessel1
	genericTitle = #loc_KSS_Spectrometron_genericTitle
    group = BasesandStations
	description = @/loc_KSS_Spectrometron_description_s1 + @/targetVessel1 + @/loc_KSS_Spectrometron_description_s2
	genericDescription = #loc_KSS_Spectrometron_genericDescription
    synopsis = @/loc_KSS_shared_Add_a_WT_SIT_Spectrometron_to + @/targetVessel1
    completedMessage = #loc_KSS_Spectrometron_completedMessage
    
	minExpiry = 1
    maxExpiry = 7
    
	cancellable = true
    declinable = true
	maxSimultaneous = 1
    
	rewardScience = 0.0
    rewardReputation = 1.0
    rewardFunds = Random(45000.0, 55000.0)
    failureReputation = 1.0
    failureFunds = 50000.0
    advanceFunds = 50000.0
	
	targetBody = @/targetBody1
	
	//Find a Station with a Research Lab but without a Spectrometron
	DATA
    {
        type = Vessel
		uniquenessCheck = CONTRACT_ACTIVE
		requiredValue = true
		targetVessel1 = AllVessels().Where(v =>v.Parts().Contains(StnSciSpectro) == false && v.Parts().Contains(StnSciLab) == true && v.VesselType() == Station && v.CrewCount() > 0).SelectUnique()
		//targetVessle2 = @targetVessel1.Where(v => v.Parts().Contains(StnSciSpectro) == false && v.Parts().Contains(StnSciLab) == true )
		title = #loc_KSS_Spectrometron_DATA1_title
    }

	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}
	

	PARAMETER
	{
		name = PartValidation
		type = PartValidation
		title = @/loc_KSS_Spectrometron_PARAMETER1_title_2_s1 + @/targetVessel1 + @/loc_KSS_Spectrometron_PARAMETER1_title_2_s2
		VALIDATE
		{
			part = StnSciSpectro
		}
	}

	PARAMETER
	{
		name = Docking
		type = Docking
		vessel = @/targetVessel1
		title = @/loc_KSS_Spectrometron_PARAMETER2_title_3_s1 + @/targetVessel1
		hideChildren = true
		completeInSequence = true
	}
	
		REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		checkOnActiveContract = false
		part = StnSciSpectro
	}
}